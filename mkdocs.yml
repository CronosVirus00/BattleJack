site_name: BattleJack
site_url: https://cronosvirus00.github.io/BattleJack/
repo_url: https://github.com/CronosVirus00/BattleJack

validation:
  links:
    absolute_links: relative_to_docs

theme:
  name: material
  language: it
  features:
   - navigation.tabs          # Mantiene le pagine principali nella barra in alto
   - navigation.tabs.only     # Evita di mostrare l'albero delle pagine a sinistra[cite: 1]
   - navigation.top           # Pulsante per tornare su[cite: 1]
   - search.suggest           #[cite: 1]
   - search.highlight         #[cite: 1]
   - toc.integrate            # Sposta l'indice dei contenuti (TOC) nella barra di sinistra

extra_css:
  - stylesheets/custom.css
  
plugins:
  - search
  - autorefs
  - glightbox

markdown_extensions:
  - def_list
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.blocks.caption
  - pymdownx.tasklist:
      custom_checkbox: true